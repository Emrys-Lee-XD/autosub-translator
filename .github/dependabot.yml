version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # google-genai 1.75.0 requires tenacity<9.2.0. Revisit with the next SDK update.
    # Defer ordinary minor updates only; security updates and patches remain eligible.
    ignore:
      - dependency-name: tenacity
        update-types: ["version-update:semver-minor"]
    # This filter applies only to version updates; security updates remain eligible.
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      python-maintenance:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      actions-maintenance:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
