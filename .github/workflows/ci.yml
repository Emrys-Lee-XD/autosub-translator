name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --upgrade "pip>=26.2.2,<27"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python scripts/check_ca_bundles.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q -x "[\\/]\.venv[\\/]" .
      - run: python scripts/release_audit.py
      - run: python scripts/build_source_release.py

  locked:
    if: github.event_name != 'schedule'
    name: Locked dependencies (Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints-windows-py313.txt
      - run: python -m pip install --upgrade "pip>=26.2.2,<27"
      - run: python -m pip install -r requirements-dev.txt -c constraints-windows-py313.txt
      - run: python -m pip check
      - run: python scripts/check_ca_bundles.py
      - run: python -m unittest discover -s tests -v

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade "pip>=26.2.2,<27" "pip-audit==2.10.1"
      - name: Audit every pinned dependency against public advisories
        run: python -m pip_audit --strict --disable-pip --no-deps --progress-spinner off -r constraints-windows-py313.txt
